<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💣 сапёр · мистер пидор</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background-image: url('i.webp');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* полупрозрачный тёмный слой, чтобы контент читался */
        .game-container {
            background-color: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(2px);
            border: 3px solid #6b4f3c;
            border-radius: 20px;
            padding: 25px 30px;
            box-shadow: 0 0 30px #3a2a1e;
            margin: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            color: #deb887;
            text-shadow: 2px 2px 0 #4d3e2e;
            font-weight: bold;
            font-size: 24px;
        }

        .header span {
            background: #2b1e14;
            padding: 8px 20px;
            border-radius: 40px;
            border: 2px solid #8b6e4b;
            box-shadow: inset 0 -2px 0 #3f2e1f;
            letter-spacing: 2px;
        }

        .reset-btn {
            background: #3e2c1c;
            color: #ffc491;
            border: 3px solid #7a5d3d;
            font-size: 28px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s ease;
            box-shadow: 0 5px 0 #412f1d, 0 8px 12px black;
            font-family: monospace;
        }

        .reset-btn:active {
            transform: translateY(5px);
            box-shadow: 0 2px 0 #3f2e1f, 0 5px 10px black;
        }

        /* поле — сетка */
        .board {
            display: inline-grid;
            grid-template-columns: repeat(9, 44px);
            grid-template-rows: repeat(9, 44px);
            gap: 3px;
            background: #503e2b;
            padding: 12px;
            border-radius: 24px;
            border: 5px solid #6f5237;
            box-shadow: inset 0 0 0 2px #2f210f, 0 10px 20px black;
        }

        .cell {
            background-color: #a79279;
            background-image: radial-gradient(circle at 40% 40%, #cdb89a, #7d6649);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 23px;
            color: #2f1f0e;
            text-shadow: 1px 1px 0 #e2caa8;
            box-shadow: inset -2px -4px 0 #4d3a24, inset 2px 2px 0 #f0dbb8;
            cursor: pointer;
            transition: 0.08s linear;
            font-family: 'Courier New', monospace;
        }

        .cell:active {
            box-shadow: inset 2px 2px 0 #4d3a24, inset -2px -2px 0 #f0dbb8;
            transform: scale(0.97);
        }

        .cell.open {
            background: #baa68b;
            background-image: none;
            box-shadow: inset 2px 2px 5px #4f3f2b;
            color: #3a2b18;
            text-shadow: none;
        }

        .cell.flag::after {
            content: "⚑";
            font-size: 28px;
            line-height: 1;
            color: #b11e1e;
            text-shadow: 2px 2px 0 #2d0000;
            margin-top: -6px;
        }

        /* анимация взрыва */
        .cell.boom {
            background-color: #f5a461;
            background-image: radial-gradient(circle, #ffc89c, #ff6a4b);
            box-shadow: 0 0 25px #ff6600, inset 0 0 10px #fff3b0;
            transform: scale(1.2);
            color: black;
            font-size: 32px;
            transition: 0.1s;
            z-index: 10;
        }

        /* всплывающее окно (победа/проигрыш) */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: #2c1f13;
            border: 6px double #dba570;
            border-radius: 50px 10px 50px 10px;
            padding: 30px 60px;
            box-shadow: 0 0 50px #d48d4b, 0 10px 30px black;
            text-align: center;
            color: #ffdbb5;
            font-size: 44px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 3px 3px 0 #663f1a;
            opacity: 0;
            visibility: hidden;
            transition: 0.2s ease;
            z-index: 999;
            font-family: 'Courier New', monospace;
            white-space: nowrap;
        }

        .popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .popup small {
            display: block;
            font-size: 20px;
            color: #c7a472;
            margin-top: 15px;
            letter-spacing: 2px;
            text-decoration: underline wavy #ab6d3b;
        }

        .boom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at var(--x) var(--y), #ffb56b, transparent 70%);
            opacity: 0;
            transition: 0.2s;
            z-index: 500;
        }
        .boom-overlay.active {
            opacity: 0.7;
        }

        /* ссылка назад как в оригинале */
        .back-link {
            margin-top: 20px;
            font-size: 24px;
            background: #2a1d12c9;
            padding: 8px 28px;
            border-radius: 60px;
            border: 2px solid #ad7a4b;
            backdrop-filter: blur(4px);
        }
        .back-link a {
            color: #ffbf81;
            text-decoration: wavy underline #ab6d3b;
            font-weight: bold;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <span>💣  M I N E S  9x9</span>
            <div class="reset-btn" id="resetBtn">↻</div>
        </div>

        <div class="board" id="board"></div>

        <!-- ссылка cam back как в penis.html -->
        <div class="back-link">
            <a href="PIDOR.html">⏎ cam back</a>
        </div>
    </div>

    <!-- всплывающие окна -->
    <div class="popup" id="winPopup">
        💥 ВЫ ПОБЕДИЛИ 💥
        <small>✧  ты красавчик  ✧</small>
    </div>
    <div class="popup" id="losePopup">
        ☠  ВЗРЫВ  ☠
        <small>  начни заново  </small>
    </div>

    <!-- эффект вспышки взрыва -->
    <div class="boom-overlay" id="boomOverlay"></div>

    <script>
        (function() {
            const ROWS = 9;
            const COLS = 9;
            const TOTAL_MINES = 12;

            let board = [];              // игровое поле (объекты)
            let mines = new Set();        // позиции мин (строка-столбец)
            let gameActive = true;
            let flags = new Set();        // поставленные флаги
            let openCount = 0;             // количество открытых безопасных клеток

            const boardEl = document.getElementById('board');
            const resetBtn = document.getElementById('resetBtn');
            const winPopup = document.getElementById('winPopup');
            const losePopup = document.getElementById('losePopup');
            const boomOverlay = document.getElementById('boomOverlay');

            // инициализация поля
            function initBoard(firstClickRow = -1, firstClickCol = -1) {
                // создаём пустую матрицу
                board = Array(ROWS).fill().map(() => Array(COLS).fill().map(() => ({
                    mine: false,
                    neighborMines: 0,
                    open: false,
                    flagged: false,
                })));

                mines.clear();
                flags.clear();
                openCount = 0;

                // расставляем мины (избегаем первую клетку если firstClickRow >=0)
                let minesPlaced = 0;
                while (minesPlaced < TOTAL_MINES) {
                    const r = Math.floor(Math.random() * ROWS);
                    const c = Math.floor(Math.random() * COLS);
                    const key = `${r},${c}`;

                    // если уже мина или это первый клик (и там не должно быть мины) — пропускаем
                    if (mines.has(key)) continue;
                    if (firstClickRow === r && firstClickCol === c) continue;

                    mines.add(key);
                    board[r][c].mine = true;
                    minesPlaced++;
                }

                // считаем соседей
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c].mine) continue;
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && board[nr][nc].mine) count++;
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }

            // отрисовка поля
            function renderBoard() {
                boardEl.innerHTML = '';
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        const cell = board[r][c];
                        const cellDiv = document.createElement('div');
                        cellDiv.className = 'cell';
                        if (cell.open) cellDiv.classList.add('open');
                        if (cell.flagged && !cell.open) cellDiv.classList.add('flag'); // показываем флаг только если клетка закрыта

                        // содержимое
                        if (cell.open) {
                            if (cell.mine) {
                                cellDiv.textContent = '💣';
                            } else {
                                cellDiv.textContent = cell.neighborMines > 0 ? cell.neighborMines : '';
                            }
                        } else {
                            // убираем текст, флаг отображается псевдоэлементом
                            cellDiv.textContent = '';
                        }

                        // data-атрибуты
                        cellDiv.dataset.row = r;
                        cellDiv.dataset.col = c;

                        // слушатели
                        cellDiv.addEventListener('click', (e) => handleClick(e, r, c));
                        cellDiv.addEventListener('contextmenu', (e) => handleRightClick(e, r, c));

                        boardEl.appendChild(cellDiv);
                    }
                }
            }

            // открыть клетку (рекурсивно, если ноль)
            function openCell(row, col) {
                if (!gameActive) return;
                const cell = board[row][col];
                if (cell.open || cell.flagged) return;

                // если это мина — проигрыш
                if (cell.mine) {
                    triggerLose(row, col);
                    return;
                }

                // открываем клетку
                cell.open = true;
                openCount++;

                // обновляем ячейку в DOM
                const idx = row * COLS + col;
                const cellDiv = boardEl.children[idx];
                cellDiv.classList.add('open');
                cellDiv.classList.remove('flag');
                if (cell.neighborMines > 0) {
                    cellDiv.textContent = cell.neighborMines;
                } else {
                    cellDiv.textContent = '';
                }

                // если число соседей 0, рекурсивно открываем соседей
                if (cell.neighborMines === 0) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = row + dr, nc = col + dc;
                            if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !board[nr][nc].open && !board[nr][nc].flagged) {
                                openCell(nr, nc);
                            }
                        }
                    }
                }

                // проверка победы
                if (openCount === ROWS * COLS - TOTAL_MINES) {
                    winPopup.classList.add('show');
                    gameActive = false;
                }
            }

            // правый клик — флаг
            function handleRightClick(e, row, col) {
                e.preventDefault();
                if (!gameActive) return;
                const cell = board[row][col];
                if (cell.open) return; // нельзя ставить флаг на открытое

                const cellDiv = boardEl.children[row * COLS + col];
                if (cell.flagged) {
                    // снять флаг
                    cell.flagged = false;
                    cellDiv.classList.remove('flag');
                    flags.delete(`${row},${col}`);
                } else {
                    // поставить флаг
                    cell.flagged = true;
                    cellDiv.classList.add('flag');
                    flags.add(`${row},${col}`);
                }
            }

            // левый клик
            function handleClick(e, row, col) {
                e.preventDefault();
                if (!gameActive) return;

                // если поле ещё не инициализировано минами (первый клик), подстраиваем мины под безопасность
                if (mines.size === 0) {
                    // первая итерация: инициализируем с гарантией, что (row, col) без мины
                    initBoard(row, col);
                    renderBoard(); // обновим, так как клетки могли измениться
                    // рекурсивно открываем стартовую клетку
                    openCell(row, col);
                    return;
                }

                const cell = board[row][col];
                if (cell.flagged) return; // зафлагожено — не открываем

                openCell(row, col);
            }

            // проигрыш со взрывом
            function triggerLose(row, col) {
                gameActive = false;

                // подсветим мину, на которой взорвались
                const cellDiv = boardEl.children[row * COLS + col];
                cellDiv.classList.add('boom');

                // анимация вспышки
                const rect = cellDiv.getBoundingClientRect();
                const x = rect.left + rect.width / 2;
                const y = rect.top + rect.height / 2;
                boomOverlay.style.setProperty('--x', x + 'px');
                boomOverlay.style.setProperty('--y', y + 'px');
                boomOverlay.classList.add('active');
                setTimeout(() => boomOverlay.classList.remove('active'), 400);

                // показываем все мины
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (board[r][c].mine) {
                            const idx = r * COLS + c;
                            const d = boardEl.children[idx];
                            d.classList.add('open');
                            d.textContent = '💣';
                        }
                    }
                }

                // показываем окно проигрыша
                losePopup.classList.add('show');
            }

            // сброс игры
            function resetGame() {
                gameActive = true;
                flags.clear();
                openCount = 0;
                mines.clear();
                initBoard(); // просто заполняем рандомом (без первого клика)
                renderBoard();

                // скрыть попапы
                winPopup.classList.remove('show');
                losePopup.classList.remove('show');
                boomOverlay.classList.remove('active');
            }

            // первичная инициализация (без гарантии первого клика — начнём с пустым mines, первый клик сам переинициализирует)
            function initialSetup() {
                // создаём полностью пустые ячейки, мины появятся после первого клика
                board = Array(ROWS).fill().map(() => Array(COLS).fill().map(() => ({
                    mine: false,
                    neighborMines: 0,
                    open: false,
                    flagged: false,
                })));
                mines.clear();
                openCount = 0;
                gameActive = true;
                flags.clear();
                renderBoard();

                winPopup.classList.remove('show');
                losePopup.classList.remove('show');
                boomOverlay.classList.remove('active');
            }

            // клик по ресету
            resetBtn.addEventListener('click', () => {
                resetGame();
            });

            // запуск
            initialSetup();

            // предотвращаем стандартное контекстное меню на всей доске
            boardEl.addEventListener('contextmenu', (e) => e.preventDefault());

        })();
    </script>
</body>
</html>
