<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сапёр · Имперский вариант</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cinzel', 'Times New Roman', serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(ellipse at top, #1a0b0b 0%, #0a0507 80%);
            color: #e0d8b0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem;
            border-left: 6px solid #a65d2c;
            border-right: 6px solid #a65d2c;
            box-shadow: inset 0 0 50px rgba(186, 85, 55, 0.3);
            position: relative;
        }

        body::before {
            content: "⚜️⚜️⚜️";
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3rem;
            opacity: 0.15;
            letter-spacing: 20px;
            color: #b87333;
            text-shadow: 0 0 15px #ffaa33;
            pointer-events: none;
            z-index: 0;
        }

        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 8px;
            text-align: center;
            color: #f5e6d3;
            text-shadow: 4px 4px 0 #3a1f0f, 8px 8px 0 #00000088, 0 0 20px #cf7f32;
            margin-bottom: 2rem;
            border-bottom: 3px double #c59a6b;
            padding-bottom: 1rem;
            width: fit-content;
            max-width: 90vw;
            line-height: 1.2;
            z-index: 2;
        }

        /* основные две кнопки выбора режима */
        .main-mode-selector {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            z-index: 2;
        }

        .main-mode-btn {
            padding: 1.5rem 4rem;
            font-size: 2.2rem;
            background: #1f130b;
            border: 4px ridge #b87333;
            color: #fff0cf;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 15px #d48b4b, inset 0 0 15px #5e3018;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 4px;
            min-width: 300px;
        }

        .main-mode-btn.active {
            background: #3f2819;
            border-color: #ffc285;
            box-shadow: 0 0 30px #ff9900;
            color: #ffffff;
        }

        .main-mode-btn:hover {
            transform: translateY(-3px);
            background: #4f311c;
            border-color: #eeb46b;
            box-shadow: 0 0 25px #f90;
        }

        /* готовые сложности */
        #presetSettings {
            display: none;
            z-index: 2;
            width: 100%;
        }

        #presetSettings.show {
            display: block;
        }

        .preset-buttons {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
        }

        .preset-btn {
            padding: 1rem 2rem;
            font-size: 1.8rem;
            background: #1f130b;
            border: 4px ridge #b87333;
            color: #fff0cf;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 15px #d48b4b;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .preset-btn:hover {
            background: #3f2819;
            border-color: #ffc285;
            box-shadow: 0 0 30px #ff9900;
            transform: scale(1.05);
        }

        /* свои параметры */
        #customSettings {
            background: #1c110bb0;
            backdrop-filter: blur(3px);
            border: 8px solid;
            border-image: repeating-linear-gradient(45deg, #6b4b29, #cfa668 20px, #493520 30px) 30;
            padding: 2rem;
            margin: 2rem 0;
            width: 100%;
            max-width: 800px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            z-index: 2;
        }

        #customSettings.show {
            display: flex;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .setting-row label {
            font-size: 2rem;
            color: #fadfad;
            text-shadow: 2px 2px 0 #2b1508;
            min-width: 200px;
        }

        .setting-row input {
            padding: 1rem 2rem;
            font-size: 1.8rem;
            background: #2f1e14;
            border: 4px ridge #b87333;
            color: #f3d9b1;
            border-radius: 60px;
            text-align: center;
            font-family: 'Cormorant Garamond', serif;
            box-shadow: inset 0 0 30px #000000;
            width: 150px;
        }

        .setting-row input:focus {
            outline: none;
            border-color: #ffc285;
            box-shadow: 0 0 30px #ff9900, inset 0 0 30px #5e3018;
        }

        .start-btn {
            padding: 1.5rem 4rem;
            font-size: 2rem;
            background: #1f130b;
            border: 4px ridge #b87333;
            color: #fff0cf;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 15px #d48b4b;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 1rem 0;
        }

        .start-btn:hover {
            background: #3f2819;
            border-color: #ffc285;
            box-shadow: 0 0 30px #ff9900;
            transform: scale(1.05);
        }

        .game-info {
            display: flex;
            gap: 3rem;
            margin: 2rem 0;
            font-size: 2rem;
            color: #bc9e75;
            text-shadow: 0 0 15px #b87c4b;
            z-index: 2;
        }

        .game-board {
            display: inline-grid;
            gap: 2px;
            background: #6b4f3a;
            padding: 4px;
            border: 8px solid;
            border-image: repeating-linear-gradient(45deg, #6f4e2e, #cba87a 15px, #3a281b 25px) 30 stretch;
            outline: 3px solid #997a4d;
            outline-offset: 5px;
            box-shadow: 0 20px 40px #000000cc;
            margin: 2rem 0;
            z-index: 2;
        }

        .cell {
            width: 40px;
            height: 40px;
            background: #2f1e14;
            border: 2px ridge #b87333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #fadfad;
            cursor: pointer;
            transition: 0.1s;
            text-shadow: 0 0 5px #ffaa33;
        }

        .cell.revealed {
            background: #1a0f0a;
            border-color: #a8612b;
            box-shadow: inset 0 0 10px #000000;
        }

        .cell.mine {
            background: #8b0000;
            border-color: #ff0000;
            color: white;
            box-shadow: 0 0 20px #ff0000;
        }

        .cell.flagged::before {
            content: "⚜️";
            font-size: 1.8rem;
        }

        .restart-container {
            margin: 2rem 0;
            z-index: 2;
        }

        .restart-btn {
            padding: 1.5rem 5rem;
            font-size: 2.2rem;
            background: #1f130b;
            border: 4px ridge #b87333;
            color: #fff0cf;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 15px #d48b4b;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
            display: none;
        }

        .restart-btn.show {
            display: inline-block;
        }

        .restart-btn:hover {
            background: #3f2819;
            border-color: #ffc285;
            box-shadow: 0 0 30px #ff9900;
            transform: scale(1.05);
        }

        .footer-note {
            margin-top: 3rem;
            color: #6b4f3a;
            font-size: 1.5rem;
            text-align: center;
            border-top: 1px solid #a15926;
            padding-top: 1.5rem;
            width: 100%;
            font-family: monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
            z-index: 2;
        }

        .message {
            font-size: 2rem;
            color: #bc9e75;
            text-shadow: 0 0 15px #ff7700;
            margin: 1rem 0;
            min-height: 3rem;
        }
    </style>
</head>
<body>
    <h1>✠ ИМПЕРСКИЙ САПЁР ✠</h1>

    <!-- всего две кнопки: своя сложность и выбор сложности -->
    <div class="main-mode-selector">
        <button class="main-mode-btn active" id="presetMainBtn" onclick="showPresetMode()">ВЫБОР СЛОЖНОСТИ</button>
        <button class="main-mode-btn" id="customMainBtn" onclick="showCustomMode()">СВОЯ СЛОЖНОСТЬ</button>
    </div>

    <!-- готовые сложности -->
    <div id="presetSettings" class="show">
        <div class="preset-buttons">
            <button class="preset-btn" onclick="startPresetGame(8, 8, 10)">НОВИЧОК (8x8, 10)</button>
            <button class="preset-btn" onclick="startPresetGame(12, 12, 25)">ЛЮБИТЕЛЬ (12x12, 25)</button>
            <button class="preset-btn" onclick="startPresetGame(16, 16, 45)">ПРОФЕССИОНАЛ (16x16, 45)</button>
            <button class="preset-btn" onclick="startPresetGame(20, 20, 75)">БЕЗУМЕЦ (20x20, 75)</button>
        </div>
    </div>

    <!-- свои параметры (скрыто по умолчанию) -->
    <div id="customSettings">
        <div class="setting-row">
            <label>ШИРИНА (5-20):</label>
            <input type="number" id="widthInput" min="5" max="20" value="10">
        </div>
        <div class="setting-row">
            <label>ВЫСОТА (5-20):</label>
            <input type="number" id="heightInput" min="5" max="20" value="10">
        </div>
        <div class="setting-row">
            <label>БОМБЫ (1-200):</label>
            <input type="number" id="minesInput" min="1" max="200" value="15">
        </div>
        <button class="start-btn" onclick="startCustomGame()">НАЧАТЬ</button>
    </div>

    <!-- игровая информация -->
    <div class="game-info" id="gameInfo" style="display: none;">
        <span>💣 <span id="minesLeft">0</span></span>
        <span>⚔️ <span id="gameStatus">ИГРА</span></span>
    </div>

    <!-- игровое поле -->
    <div id="gameBoard" class="game-board"></div>

    <!-- сообщения -->
    <div class="message" id="message"></div>

    <!-- кнопка заново (появляется при победе/поражении) -->
    <div class="restart-container">
        <button class="restart-btn" id="restartBtn" onclick="restartGame()">ЗАНОВО</button>
    </div>

    <div class="footer-note">
        ✦ MINE · IMPERIUM ✦
    </div>

    <script>
        let board = [];
        let rows = 8, cols = 8, totalMines = 10;
        let gameActive = false;
        let gameWon = false;
        let firstMove = true;
        let currentMode = 'preset'; // preset или custom

        function showPresetMode() {
            document.getElementById('presetMainBtn').classList.add('active');
            document.getElementById('customMainBtn').classList.remove('active');
            document.getElementById('presetSettings').classList.add('show');
            document.getElementById('customSettings').classList.remove('show');
            currentMode = 'preset';
            
            // скрываем игровые элементы при смене режима
            document.getElementById('gameInfo').style.display = 'none';
            document.getElementById('gameBoard').innerHTML = '';
            document.getElementById('message').textContent = '';
            document.getElementById('restartBtn').classList.remove('show');
        }

        function showCustomMode() {
            document.getElementById('customMainBtn').classList.add('active');
            document.getElementById('presetMainBtn').classList.remove('active');
            document.getElementById('customSettings').classList.add('show');
            document.getElementById('presetSettings').classList.remove('show');
            currentMode = 'custom';
            
            // скрываем игровые элементы при смене режима
            document.getElementById('gameInfo').style.display = 'none';
            document.getElementById('gameBoard').innerHTML = '';
            document.getElementById('message').textContent = '';
            document.getElementById('restartBtn').classList.remove('show');
        }

        function startPresetGame(r, c, m) {
            rows = r;
            cols = c;
            totalMines = m;
            firstMove = true;
            initBoard();
            document.getElementById('gameInfo').style.display = 'flex';
            document.getElementById('message').textContent = '';
            document.getElementById('restartBtn').classList.remove('show');
        }

        function startCustomGame() {
            const w = parseInt(document.getElementById('widthInput').value);
            const h = parseInt(document.getElementById('heightInput').value);
            const m = parseInt(document.getElementById('minesInput').value);

            if (w < 5 || w > 20 || h < 5 || h > 20) {
                alert('Размеры должны быть от 5 до 20');
                return;
            }
            const maxMines = w * h - 1;
            if (m < 1 || m > maxMines) {
                alert(`Количество бомб должно быть от 1 до ${maxMines}`);
                return;
            }

            rows = h;
            cols = w;
            totalMines = m;
            firstMove = true;
            initBoard();
            document.getElementById('gameInfo').style.display = 'flex';
            document.getElementById('message').textContent = '';
            document.getElementById('restartBtn').classList.remove('show');
        }

        function restartGame() {
            // перезапуск с текущими параметрами
            firstMove = true;
            initBoard();
            document.getElementById('message').textContent = '';
            document.getElementById('restartBtn').classList.remove('show');
        }

        function initBoard() {
            // создаём пустое поле
            board = Array(rows).fill().map(() => Array(cols).fill().map(() => ({
                mine: false,
                revealed: false,
                flagged: false,
                neighborMines: 0
            })));

            gameActive = true;
            gameWon = false;
            renderBoard();
            updateMinesLeft();
            document.getElementById('gameStatus').textContent = 'ИГРА';
        }

        function placeMines(firstRow, firstCol) {
            let minesPlaced = 0;
            while (minesPlaced < totalMines) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * cols);
                
                if (!board[r][c].mine && !(r === firstRow && c === firstCol)) {
                    board[r][c].mine = true;
                    minesPlaced++;
                }
            }
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) continue;
                    
                    let count = 0;
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            if (dr === 0 && dc === 0) continue;
                            const nr = r + dr;
                            const nc = c + dc;
                            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                                count++;
                            }
                        }
                    }
                    board[r][c].neighborMines = count;
                }
            }
        }

        function revealCell(r, c) {
            if (!gameActive || gameWon) return;
            if (board[r][c].revealed || board[r][c].flagged) return;

            if (firstMove) {
                firstMove = false;
                placeMines(r, c);
            }

            board[r][c].revealed = true;

            if (board[r][c].mine) {
                gameActive = false;
                revealAllMines();
                document.getElementById('gameStatus').textContent = 'ПОРАЖЕНИЕ';
                document.getElementById('message').textContent = 'ТЫ ПОДОРВАЛСЯ НА МИНЕ';
                document.getElementById('restartBtn').classList.add('show');
                renderBoard();
                return;
            }

            if (board[r][c].neighborMines === 0) {
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        if (dr === 0 && dc === 0) continue;
                        const nr = r + dr;
                        const nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && !board[nr][nc].revealed && !board[nr][nc].flagged) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }

            checkWin();
            renderBoard();
        }

        function toggleFlag(r, c, event) {
            event.preventDefault();
            if (!gameActive || gameWon || board[r][c].revealed) return;

            board[r][c].flagged = !board[r][c].flagged;
            updateMinesLeft();
            renderBoard();
            checkWin();
        }

        function updateMinesLeft() {
            const flaggedCount = board.flat().filter(cell => cell.flagged).length;
            document.getElementById('minesLeft').textContent = totalMines - flaggedCount;
        }

        function checkWin() {
            let allNonMinesRevealed = true;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].mine && !board[r][c].revealed) {
                        allNonMinesRevealed = false;
                        break;
                    }
                }
            }

            if (allNonMinesRevealed) {
                gameActive = false;
                gameWon = true;
                document.getElementById('gameStatus').textContent = 'ПОБЕДА';
                document.getElementById('message').textContent = 'ИМПЕРИЯ ТОРЖЕСТВУЕТ';
                document.getElementById('restartBtn').classList.add('show');
                renderBoard();
            }
        }

        function revealAllMines() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) {
                        board[r][c].revealed = true;
                    }
                }
            }
        }

        function renderBoard() {
            const boardDiv = document.getElementById('gameBoard');
            boardDiv.style.gridTemplateColumns = `repeat(${cols}, 40px)`;
            
            let html = '';
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = board[r][c];
                    let cellClass = 'cell';
                    let content = '';

                    if (cell.revealed) {
                        cellClass += ' revealed';
                        if (cell.mine) {
                            cellClass += ' mine';
                            content = '💀';
                        } else {
                            content = cell.neighborMines > 0 ? cell.neighborMines : '';
                        }
                    } else if (cell.flagged) {
                        cellClass += ' flagged';
                    }

                    html += `<div class="${cellClass}" data-row="${r}" data-col="${c}" 
                        onclick="handleCellClick(${r}, ${c})" 
                        oncontextmenu="toggleFlag(${r}, ${c}, event)">${content}</div>`;
                }
            }
            boardDiv.innerHTML = html;
        }

        function handleCellClick(r, c) {
            if (!gameActive || gameWon) return;
            if (board[r][c].flagged) return;

            revealCell(r, c);
        }

        // начальное состояние
        showPresetMode();
    </script>
</body>
</html>
